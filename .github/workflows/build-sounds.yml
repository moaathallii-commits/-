name: Auto-Build Human Voices (sounds/)

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 3:15 فجراً بتوقيت UTC
    - cron: '15 3 * * *'
  workflow_dispatch:
    inputs:
      max_clips:
        description: 'أقصى عدد مقاطع في هذه الجولة'
        required: false
        default: '12'

permissions:
  contents: write

jobs:
  build-voices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Generate Missing Human Voice Clips
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_: ${{ secrets.GEMINI_API_KEY_ }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          MAX_CLIPS_PER_RUN: ${{ github.event.inputs.max_clips || '12' }}
        run: node scripts/generate_sounds.mjs

      - name: Commit & Push New Audio Files
        run: |
          git config user.name "Moaath Store Voice Bot"
          git config user.email "actions@github.com"
          git add sounds/
          if ! git diff --cached --quiet; then
            git commit -m "🔊 إضافة مقاطع صوتية بشرية جديدة تلقائياً"
            git push
          else
            echo "لا توجد مقاطع جديدة للرفع في هذه الجولة."
          fi
