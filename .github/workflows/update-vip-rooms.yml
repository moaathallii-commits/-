name: Auto-Update VIP Daily Rooms & Visuals (vip_media/)

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 3:30 فجراً بتوقيت UTC
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-vip-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Daily VIP Feed & Visual Cards
        run: node scripts/update_vip_daily_feed.mjs

      - name: Commit & Push Updated VIP Media
        run: |
          git config user.name "Moaath Store VIP Bot"
          git config user.email "actions@github.com"
          git add -f vip_media/
          if ! git diff --cached --quiet; then
            git commit -m "تحديث يومي تلقائي لغرف VIP والصور التوضيحية"
            git pull --rebase origin HEAD || true
            git push
          else
            echo "محتوى غرف VIP محدث بالفعل لهذا اليوم."
          fi
