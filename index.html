<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر معاذ - قرية العوينة</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --gold-color: #D4AF37;
            --text-color: #FFFFFF;
            --gray-text: #AAAAAA;
            --danger-color: #ff4444;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--gold-color);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .store-info h1 {
            font-size: 16px;
            color: var(--gold-color);
            margin: 0 0 3px 0;
        }
        .store-info p {
            font-size: 11px;
            color: var(--gray-text);
            margin: 0;
        }
        .logo-circle {
            width: 42px;
            height: 42px;
            background-color: var(--gold-color);
            color: var(--bg-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
        }
        .user-bar {
            background: #181818;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .container {
            padding: 10px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--gold-color);
            color: #fff;
            border-radius: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .categories {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .cat-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }
        .cat-btn.active {
            background: var(--gold-color);
            color: #000;
            font-weight: bold;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 6px;
            background: #2a2a2a;
            margin-bottom: 6px;
        }
        .product-card h3 {
            font-size: 13px;
            margin: 4px 0;
        }
        .product-card p {
            color: var(--gold-color);
            font-size: 12px;
            margin: 4px 0;
        }
        .btn {
            background: var(--gold-color);
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }
        .btn-danger {
            background: var(--danger-color);
            color: #fff;
        }
        .btn-out {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border-top: 2px solid var(--gold-color);
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            z-index: 99;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center; align-items: center;
            z-index: 1000;
            padding: 10px;
            box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--gold-color);
            width: 100%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .form-group {
            margin-bottom: 12px;
            text-align: right;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--gold-color);
            margin-bottom: 4px;
        }
        .form-control {
            width: 100%;
            padding: 8px;
            background: #121212;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div class="store-info">
            <h1>متجر معاذ</h1>
            <p>قرية العوينة | 0965461504</p>
        </div>
        <!-- الشعار السري للإدارة بـ 5 ضغطات -->
        <div class="logo-circle" id="adminTrigger">م</div>
    </header>

    <div class="user-bar">
        <span>👤 الزبون: <b id="userNameDisplay">زائر</b></span>
        <span style="color: var(--gold-color);">🎁 هدية متجر معاذ: <b id="userPoints">0</b> نقطة</span>
    </div>

    <div class="container">
        <!-- شريط البحث الفوري -->
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن أي منتج..." oninput="filterProducts()">

        <!-- شريط الفئات -->
        <div class="categories">
            <button class="cat-btn active" onclick="setCategory('الكل', this)">الكل</button>
            <button class="cat-btn" onclick="setCategory('غذائيات', this)">غذائيات</button>
            <button class="cat-btn" onclick="setCategory('منظفات', this)">منظفات</button>
            <button class="cat-btn" onclick="setCategory('مشروبات باردة وساخنة', this)">مشروبات باردة وساخنة</button>
            <button class="cat-btn" onclick="setCategory('نقرشات', this)">نقرشات</button>
        </div>

        <!-- شبكة المنتجات -->
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div style="height: 70px;"></div>

    <!-- شريط السلة العائم -->
    <div class="cart-bar" id="cartBar" style="display:none;">
        <span>المنتجات: <b id="cartCount">0</b> | الإجمالي: <b id="cartTotal">0</b> ل.س</span>
        <button class="btn" onclick="openCheckout()" style="width: auto; padding: 8px 15px;">إتمام الطلب والدفع</button>
    </div>

    <!-- نافذة التحقق برقم الهاتف عند الدخول لأول مرة -->
    <div id="registerModal" class="modal-overlay" style="display:flex;">
        <div class="modal-content" style="text-align:center;">
            <h3 style="color: var(--gold-color); margin-top:0;">أهلاً بك في متجر معاذ 🛒</h3>
            <p style="font-size:12px; color:#aaa; line-height:1.5;">يرجى إدخال اسمك ورقم هاتفك المحمول للتحقق وبدء التسوق:</p>
            
            <div class="form-group">
                <label>الاسم الثلاثي أو الثنائي:</label>
                <input type="text" id="regName" class="form-control" placeholder="مثال: أحمد محمد العلي">
            </div>
