<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر معاذ - قرية العوينة</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212" id="themeColorMeta">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="متجر معاذ">
    <link rel="apple-touch-icon" href="store-icon.png">
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script>
        window.deferredPrompt = null;
        const isAppStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true || document.referrer.includes('android-app://');
        window.addEventListener("beforeinstallprompt", e => {
            e.preventDefault(); window.deferredPrompt = e;
            const btn = document.getElementById("mainInstallAppBtn");
            if (btn && !isAppStandalone()) btn.style.display = "inline-block";
        });
    </script>
    <style>
        :root { --bg-color:#121212; --card-bg:#1E1E1E; --gold-color:#D4AF37; --text-color:#FFFFFF; --gray-text:#AAAAAA; --danger-color:#ff4444; --success-color:#00e676; --border-color:#333333; --info-color:#00b0ff; }
        body.light-mode { --bg-color:#F0F2F5; --card-bg:#FFFFFF; --gold-color:#B8860B; --text-color:#1A1A1A; --gray-text:#666666; --success-color:#00a152; --border-color:#E0E0E0; }
        body { background-color:var(--bg-color); color:var(--text-color); font-family:Tahoma,'Segoe UI',sans-serif; margin:0; padding:0; -webkit-tap-highlight-color:transparent; transition:background-color 0.25s,color 0.25s; overscroll-behavior-y:contain; -webkit-user-select:none; user-select:none; }
        header { background-color:var(--card-bg); border-bottom:2px solid var(--gold-color); padding:10px 15px; display:flex; justify-content:space-between; align-items:center; }
        .store-info { cursor:pointer; }
        .store-info h1 { font-size:16px; color:var(--gold-color); margin:0 0 3px 0; }
        .store-info p { font-size:11px; color:var(--gray-text); margin:0; }
        .logo-circle { width:45px; height:45px; border-radius:50%; overflow:hidden; border:2px solid var(--gold-color); cursor:pointer; background:#222; flex-shrink:0; position:relative; z-index:10002; }
        .logo-circle img { width:100%; height:100%; object-fit:cover; pointer-events:none; }
        .user-bar { background:var(--card-bg); padding:8px 15px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); font-size:12px; gap:6px; flex-wrap:wrap; }
        .points-badge { color:var(--gold-color); cursor:pointer; background:rgba(212,175,55,0.12); padding:5px 10px; border-radius:15px; border:1px solid var(--gold-color); display:inline-flex; align-items:center; gap:4px; font-size:12px; }
        .container { padding:10px; }
        .search-box { width:100%; padding:10px; background:var(--bg-color); border:1px solid var(--gold-color); color:var(--text-color); border-radius:8px; margin-bottom:10px; box-sizing:border-box; }
        .special-offer-banner { background:linear-gradient(45deg,rgba(212,175,55,0.12),var(--card-bg)); border:1px solid var(--gold-color); border-radius:8px; padding:10px; margin-bottom:12px; display:flex; gap:12px; align-items:center; }
        .special-offer-img-wrap { width:80px; height:80px; border-radius:6px; overflow:hidden; border:1px solid var(--gold-color); flex-shrink:0; background:var(--bg-color); }
        .special-offer-img { width:100%; height:100%; object-fit:cover; }
        .categories { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:10px; scrollbar-width:none; }
        .cat-btn { background:var(--card-bg); color:var(--text-color); border:1px solid var(--border-color); padding:7px 12px; border-radius:15px; font-size:11px; white-space:nowrap; cursor:pointer; transition:0.2s; }
        .cat-btn.active { background:var(--gold-color); color:#000; font-weight:bold; border-color:var(--gold-color); }
        .products-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
        .product-card { background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:10px; text-align:center; display:flex; flex-direction:column; justify-content:space-between; }
        .product-img-wrap { width:100%; aspect-ratio:9/16; border-radius:6px; background:var(--bg-color); margin-bottom:6px; overflow:hidden; position:relative; }
        .product-img { width:100%; height:100%; object-fit:cover; transition:filter 0.3s ease; }
        .img-low-res { filter:blur(5px); }
        .img-high-res { filter:blur(0); }
        .product-card h3 { font-size:13px; margin:4px 0; }
        .product-card p { color:var(--gold-color); font-size:12px; margin:4px 0; font-weight:bold; }
        .btn { background:var(--gold-color); color:#000; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; font-size:12px; cursor:pointer; width:100%; box-sizing:border-box; }
        .btn-danger { background:var(--danger-color); color:#fff; }
        .btn-out { background:var(--border-color); color:var(--gray-text); cursor:not-allowed; }
        .qty-controls { display:flex; justify-content:space-between; align-items:center; background:var(--bg-color); border:1px solid var(--gold-color); border-radius:5px; overflow:hidden; width:100%; }
        .qty-btn { background:var(--gold-color); color:#000; border:none; width:30px; height:30px; font-size:16px; font-weight:bold; cursor:pointer; }
        .qty-text { color:var(--text-color); font-weight:bold; font-size:13px; padding:0 8px; }
        .cart-bar { position:fixed; bottom:0; left:0; width:100%; background:var(--card-bg); border-top:3px solid var(--gold-color); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; box-sizing:border-box; z-index:99; cursor:pointer; box-shadow:0 -4px 20px rgba(0,0,0,0.6); }
        .cart-bar-total-val { color:#00e676; font-size:15px; font-weight:900; text-shadow:0 0 10px rgba(0,230,118,0.4); }
        .cart-bar-btn { background:linear-gradient(45deg,#00e676,#00b0ff); color:#000; border:none; padding:9px 16px; border-radius:20px; font-weight:900; font-size:13px; cursor:pointer; box-shadow:0 3px 12px rgba(0,230,118,0.35); display:inline-flex; align-items:center; gap:5px; animation:pulse 1.8s infinite; white-space:nowrap; }
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:1000; padding:10px; box-sizing:border-box; }
        #adminModal { z-index: 10005 !important; }
        #adminEditCustomerModal { z-index: 10010 !important; }
        .modal-content { background:var(--card-bg); padding:16px; border-radius:10px; border:1px solid var(--gold-color); width:100%; max-width:480px; max-height:92vh; overflow-y:auto; box-sizing:border-box; }
        .form-group { margin-bottom:10px; text-align:right; }
        .form-group label { display:block; font-size:11px; color:var(--gold-color); margin-bottom:4px; font-weight:bold; }
        .form-control { width:100%; padding:8px; background:var(--bg-color); color:var(--text-color); border:1px solid var(--border-color); border-radius:5px; box-sizing:border-box; font-size:12px; }
        .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:8px; }
        .stats-box { background:var(--bg-color); border:1px solid var(--border-color); border-radius:6px; padding:9px 6px; text-align:center; }
        .stats-value { font-size:14px; font-weight:bold; color:var(--gold-color); margin-top:4px; }
        .page-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg-color); z-index:10020; overflow-y:auto; box-sizing:border-box; }
        .comp-card { background:var(--card-bg); border:1px solid var(--gold-color); border-radius:10px; padding:14px; margin-bottom:12px; }
        .leader-row, .review-box { display:flex; justify-content:space-between; align-items:center; background:var(--bg-color); border:1px solid var(--border-color); padding:8px 10px; border-radius:6px; margin-bottom:6px; font-size:12px; }
        .adm-sec { background:rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:8px; padding:12px; margin-bottom:14px; }
        .adm-sec-title { color:var(--gold-color); margin:0 0 10px 0; font-size:13px; border-bottom:1px dashed var(--border-color); padding-bottom:6px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; }
        .adm-card { background:var(--bg-color); border:1px solid var(--border-color); border-radius:6px; padding:8px; margin-bottom:6px; font-size:12px; }
        .tbl-clean { width:100%; border-collapse:collapse; font-size:11px; text-align:center; }
        .tbl-clean th { background:var(--bg-color); color:var(--gold-color); border-bottom:1px solid var(--border-color); padding:6px; position:sticky; top:0; }
        .tbl-clean td { padding:6px; border-bottom:1px solid var(--border-color); }
        .quick-inp { width:65px; padding:4px; background:var(--card-bg); color:var(--gold-color); border:1px solid var(--gold-color); border-radius:4px; text-align:center; font-weight:bold; font-size:11px; }
        .mini-btn { width:24px; height:24px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-size:13px; }
        #storeClosedOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(18,18,18,0.96); z-index:9999; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px; box-sizing:border-box; }
        @keyframes pulse { 0%{transform:scale(1);box-shadow:0 0 0 0 rgba(0,230,118,0.7);} 70%{transform:scale(1.03);box-shadow:0 0 0 8px rgba(0,230,118,0);} 100%{transform:scale(1);box-shadow:0 0 0 0 rgba(0,230,118,0);} }
    
        .page-overlay header { background-color:var(--card-bg); border-bottom:2px solid var(--gold-color); padding:10px 15px; display:flex; justify-content:space-between; align-items:center; gap:10px; position:sticky; top:0; z-index:10; }
        .page-overlay header .store-info { flex:1; min-width:0; overflow:hidden; }
        .page-overlay header .store-info h1 { font-size:15px; color:var(--gold-color); margin:0 0 2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .page-overlay header .store-info p { font-size:11px; color:var(--gray-text); margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    
        /* Toast Notification Styling */
        #toastContainer { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: 90%; max-width: 350px; text-align: center; }
        .toast-msg { background: rgba(30, 30, 30, 0.95); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 12px; font-weight: bold; border: 1px solid var(--gold-color); box-shadow: 0 4px 15px rgba(0,0,0,0.5); pointer-events: auto; animation: fadeInOut 2.5s ease forwards; }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(-10px); } 15% { opacity: 1; transform: translateY(0); } 85% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-10px); } }

    </style>
</head>
<body>

    <div id="authModal" class="modal-overlay" style="display:flex; z-index: 999999; background:var(--bg-color);">
        <div class="modal-content" style="border-color:var(--gold-color); text-align:center;">
            <div class="logo-circle" style="margin:0 auto 15px auto; width:80px; height:80px;"><img src="store-icon.png" onerror="this.src='https://via.placeholder.com/80?text=M'"></div>
            <h2 style="color:var(--gold-color); margin-top:0;">تسجيل الدخول لمتجر معاذ</h2>
            
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <button class="cat-btn active" id="tabLoginBtn" style="flex:1;" onclick="switchAuthTab('login')">تسجيل الدخول</button>
                <button class="cat-btn" id="tabRegisterBtn" style="flex:1;" onclick="switchAuthTab('register')">حساب جديد</button>
            </div>

            <div id="loginView">
                <div class="form-group"><input type="tel" id="loginPhone" class="form-control" placeholder="رقم الهاتف (09XXXXXXXX)" maxlength="10"></div>
                <div class="form-group"><input type="password" id="loginPin" class="form-control" placeholder="رمز المرور (PIN) السري"></div>
                <button onclick="handleLogin()" class="btn" style="padding:10px; font-size:14px; background:linear-gradient(45deg,#00e676,#00b0ff); color:#000; animation:pulse 2s infinite;">🔐 دخول</button>
            </div>

            <div id="registerView" style="display:none;">
                <div class="form-group"><input type="text" id="regNewName" class="form-control" placeholder="الاسم الثلاثي أو اللقب"></div>
                <div class="form-group"><input type="tel" id="regNewPhone" class="form-control" placeholder="رقم الهاتف (09XXXXXXXX)" maxlength="10"></div>
                <div class="form-group"><input type="password" id="regNewPin" class="form-control" placeholder="اختر رمز مرور سري (6 أرقام/أحرف على الأقل)"></div>
                <div class="form-group"><select id="regNewRegion" class="form-control"></select></div>
                <div class="form-group"><input type="text" id="regNewAddress" class="form-control" placeholder="العنوان بالتفصيل"></div>
                <button onclick="handleRegister()" class="btn" style="padding:10px; font-size:14px; margin-top:10px;">💾 إنشاء الحساب والدخول</button>
            </div>
            
            <div id="authErrorMsg" style="color:var(--danger-color); font-size:12px; margin-top:10px; font-weight:bold; min-height:15px;"></div>
        </div>
    </div>


    <div id="storeClosedOverlay">
        <div style="font-size:55px; margin-bottom:10px;">🌙</div>
        <h2 style="color:var(--gold-color); margin:0 0 10px 0;">المتجر أو المنطقة مغلقة حالياً</h2>
        <p id="closedMessageText" style="font-size:14px; color:var(--text-color); max-width:320px; line-height:1.6;"></p>
        <div style="margin-top:15px; font-size:12px; color:var(--gray-text);">متجر معاذ - قرية العوينة بريف حماة 🌸</div>
        <div class="logo-circle" id="closedAdminTrigger" onclick="handleAdminTrigger()" style="margin-top:25px; opacity:0.95;" title="اضغط 5 مرات لدخول الإدارة"><img src="store-icon.png" onerror="this.src='https://via.placeholder.com/45?text=M'"></div>
        
    </div>

    <header>
        <div class="store-info" onclick="window.open('https://wa.me/' + adminWhatsAppNumber, '_blank')">
            <h1>متجر معاذ</h1>
            <p>قرية العوينة | <span id="headerPhoneText">0965461504</span> 📱</p>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <button id="mainInstallAppBtn" onclick="installAppDirectly()" class="btn" style="width:auto; padding:6px 10px; font-size:11px; background:linear-gradient(45deg,#00e676,#00b0ff); color:#000; border-radius:15px; animation:pulse 2s infinite;">📲 تثبيت التطبيق</button>
            <div class="logo-circle" id="adminTrigger" onclick="handleAdminTrigger()"><img src="store-icon.png" onerror="this.src='https://via.placeholder.com/45?text=M'"></div>
        </div>
    </header>

    <div class="user-bar">
        <span style="display:flex; align-items:center; gap:5px; flex-wrap:wrap;">
            👤 <b id="userNameDisplay">زائر</b>
            <small id="userRegionBadge" style="color:var(--gray-text); font-size:10px;"></small>
            <small id="userTypeBadge" style="color:var(--gold-color); font-size:10px; font-weight:bold;"></small>
            <button onclick="openEditProfile()" style="background:transparent; border:none; color:var(--gold-color); font-size:12px; cursor:pointer; padding:0;">(⚙️)</button>
            <button onclick="logoutUser()" style="background:transparent; border:none; color:var(--danger-color); font-size:12px; cursor:pointer; padding:0;" title="تسجيل الخروج">(🚪)</button>
            <span id="userRankBadge" onclick="openCompetitionsPage()" style="display:none; cursor:pointer; background:rgba(0,230,118,0.15); color:var(--success-color); border:1px solid var(--success-color); padding:2px 7px; border-radius:12px; font-size:11px; font-weight:bold;">🏅 ترتيبي: -</span>
        </span>
        <div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap;">
            <button id="exportManagerBtn" onclick="openExportManagerModal()" style="display:none; background:linear-gradient(45deg,#ff9800,#ff5722); color:#fff; border:none; padding:4px 8px; border-radius:15px; font-size:10px; font-weight:bold; cursor:pointer;">📦 إدارة التصدير</button>
            <button id="customerDebtBtn" onclick="openCustomerDebtModal()" style="display:none; background:linear-gradient(45deg,#D4AF37,#FFD700); color:#000; border:none; padding:4px 8px; border-radius:15px; font-size:10px; font-weight:bold; cursor:pointer;">📒 دفتر الدين</button>
            <button id="partnerDashboardBtn" onclick="openPartnerDashboard()" style="display:none; background:linear-gradient(45deg,#00b0ff,#7c4dff); color:#fff; border:none; padding:4px 8px; border-radius:15px; font-size:10px; font-weight:bold; cursor:pointer;">🤝 لوحة الشريك</button>
            <button onclick="shareAppWhatsApp()" style="background:linear-gradient(45deg,#25D366,#128C7E); color:#fff; border:none; padding:4px 8px; border-radius:15px; font-size:10px; font-weight:bold; cursor:pointer;">📢 مشاركة</button>
            <button id="redeemPointsBtn" onclick="redeemPointsWhatsApp()" style="display:none; background:linear-gradient(45deg,#D4AF37,#FFD700); color:#000; border:none; padding:4px 8px; border-radius:15px; font-size:10px; font-weight:bold; cursor:pointer; animation:pulse 1.5s infinite;">🎁 استبدال</button>
            <button onclick="location.reload()" style="background:transparent; border:none; font-size:16px; cursor:pointer; padding:0;" title="تحديث الصفحة">🔄</button>
            <button onclick="toggleTheme()" id="themeBtn" style="background:transparent; border:none; font-size:16px; cursor:pointer; padding:0;">☀️</button>
            <span class="points-badge" onclick="openCompetitionsPage()">🎁 نقاطي: <b id="userPoints">0</b></span>
        </div>
    </div>

    <div class="container" style="padding-bottom:85px;">
        <div id="multipleOffersContainer"></div>
        <div style="display:flex; gap:6px; margin-bottom:10px;">
            <input type="text" id="searchInput" class="search-box" style="margin-bottom:0; flex:1;" placeholder="🔍 ابحث عن أي منتج في متجر معاذ..." oninput="renderStore()">
            <button class="btn" style="width:auto; white-space:nowrap; background:var(--card-bg); border:1px solid var(--gold-color); color:var(--gold-color);" onclick="openMissingRequestModal()">📝 طلب صنف</button>
        </div>
        <div class="categories" id="categoriesContainer"></div>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="cart-bar" id="cartBar" style="display:none;" onclick="openCartModal()">
        <div style="display:flex; flex-direction:column; gap:2px; text-align:right; flex:1;">
