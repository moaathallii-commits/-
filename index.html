<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر معاذ - قرية العوينة</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <style>
        :root { --bg-color:#121212; --card-bg:#1E1E1E; --gold-color:#D4AF37; --text-color:#FFFFFF; --gray-text:#AAAAAA; --danger-color:#ff4444; --success-color:#00e676; --border-color:#333333; }
        body { background-color:var(--bg-color); color:var(--text-color); font-family:Tahoma,sans-serif; margin:0; padding:0; direction:rtl; }
        header { background:var(--card-bg); border-bottom:2px solid var(--gold-color); padding:10px 15px; display:flex; justify-content:space-between; align-items:center; }
        .container { padding:15px; }
        .btn { background:var(--gold-color); color:#000; border:none; padding:10px 15px; border-radius:6px; font-weight:bold; cursor:pointer; width:100%; font-size:14px; margin-top:10px; }
        .products-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:15px; }
        .product-card { background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:10px; text-align:center; }
        .product-card h3 { font-size:14px; color:var(--text-color); margin:5px 0; }
        .product-card p { color:var(--gold-color); font-size:13px; font-weight:bold; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 style="color:var(--gold-color); margin:0; font-size:18px;">متجر معاذ</h1>
            <p style="color:var(--gray-text); margin:0; font-size:12px;">قرية العوينة بريف حماة</p>
        </div>
        <div id="adminTrigger" style="width:40px; height:40px; border-radius:50%; background:var(--gold-color); display:flex; align-items:center; justify-content:center; color:#000; font-weight:bold; cursor:pointer;">م</div>
    </header>

    <div class="container">
        <input type="text" id="searchInput" placeholder="🔍 ابحث عن منتج..." style="width:100%; padding:10px; background:#1E1E1E; border:1px solid var(--gold-color); color:#fff; border-radius:8px; box-sizing:border-box;" oninput="renderStore()">
        
        <div class="categories" id="categoriesContainer" style="display:flex; gap:6px; margin-top:10px; overflow-x:auto;">
            <button class="cat-btn" style="background:var(--gold-color); color:#000; border:none; padding:6px 12px; border-radius:15px; font-weight:bold;" onclick="selectCat('الكل')">الكل</button>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- المنتجات ستعرض هنا -->
        </div>
    </div>

    <script>
        if(!firebase.apps.length) firebase.initializeApp({ databaseURL: "https://moaathstore-d2fd6-default-rtdb.firebaseio.com" });
        const db = firebase.database();

        let products = {
            "p1": { name: "متة تاراوغوي 250غ", category: "مشروبات", priceUSD: 1.5, stock: 20, thumb: "" },
            "p2": { name: "سكر 1كغ", category: "مواد غذائية", priceUSD: 1.2, stock: 35, thumb: "" }
        };
        let exchangeRate = 15000;
        let selectedCat = "الكل";

        function calcSYP(usd) { return Math.round((usd * exchangeRate) / 5) * 5; }

        function renderStore() {
            const grid = document.getElementById("productsGrid");
            if(!grid) return;
            const query = (document.getElementById("searchInput")?.value || "").toLowerCase();
            let html = "";
            Object.keys(products).forEach(id => {
                const p = products[id];
                if(selectedCat !== "الكل" && p.category !== selectedCat) return;
                if(query && !p.name.toLowerCase().includes(query)) return;
                const priceSYP = calcSYP(p.priceUSD);
                html += `<div class="product-card">
                    <h3>${p.name}</h3>
                    <p>${priceSYP.toLocaleString()} ل.س</p>
                    <button class="btn" onclick="alert('تمت الإضافة للسلة')">🛒 أضف</button>
                </div>`;
            });
            grid.innerHTML = html || '<p style="grid-column:span 2; text-align:center; color:#888;">لا توجد مواد مطابقة.</p>';
        }

        function selectCat(cat) {
            selectedCat = cat;
            renderStore();
        }

        // سحب البيانات من فايربيس في حال توفرها
        db.ref("products").on("value", snap => {
            const data = snap.val();
            if(data) {
                products = data;
                renderStore();
            }
        });

        db.ref("settings/exchangeRate").on("value", snap => {
            if(snap.val()) {
                exchangeRate = parseFloat(snap.val()) || 15000;
                renderStore();
            }
        });

        window.onload = () => {
            renderStore();
        };
    </script>
</body>
</html>
