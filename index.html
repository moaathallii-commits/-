<script>
        const $ = id => document.getElementById(id);
        const setTxt = (id, v) => { const el = $(id); if (el) el.textContent = v; };
        const setVal = (id, v) => { const el = $(id); if (el) el.value = v; };
        const closeModal = id => { if ($(id)) $(id).style.display = "none"; };
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

        let adminWhatsAppNumber = "963965461504", shamWalletIdGlobal = "da3e13cd8a2ef2af282445e148df9599";
        
        // مصفوفة التحقق المشفرة (Bitwise XOR) لإخفاء كلمة المرور نهائياً من الكود المصدري
        const _K = [102,99,106,107,26,18,18,28,4,4,102,100,106,106,127,99,120];
        const verifyAdminPass = s => typeof s === "string" && s.length === _K.length && _K.every((v, i) => (s.charCodeAt(i) ^ 43) === v);

        if (!firebase.apps.length) firebase.initializeApp({ databaseURL: "https://moaathstore-d2fd6-default-rtdb.firebaseio.com" });
        const db = firebase.database();

        let exchangeRate = 15000, deliveryDriverPhone = "", exportManagerPhone = "";
        let deliveryFees = {
            "العوينة": { fee: 2000, neighborFee: 0, driverPct: 80, hoursEnabled: false, open: "08:00", close: "23:00" }
        };
        let workHoursSettings = { enabled: false, open: "08:00", close: "23:00" };
        let categories = ["الكل"], selectedCategory = "الكل", products = {}, specialOffers = {}, suppliers = {};
        let highResImagesMemoryCache = {}, noHighResAvailableSet = {}, shuffledProductKeys = [];
        let cart = {}, users = {}, pendingOrders = {}, completedOrdersHistory = {}, missingRequests = {};
        let storeExpenses = {}, creditLedgerData = {}, adminAccounting = {
            importManagerPct: 50, importManagerResetISO: "2000-01-01T00:00:00.000Z", exportManagerResetISO: "2000-01-01T00:00:00.000Z",
            capitalBoxResetISO: "2000-01-01T00:00:00.000Z", driverResetISO: "2000-01-01T00:00:00.000Z",
            maintenanceResetISO: "2000-01-01T00:00:00.000Z", treasuryDebtResetISO: "2000-01-01T00:00:00.000Z"
        };
        let compSettings = { minRedeemPoints: 500, leaderboardLimit: 10, title: "", desc: "", image: "" };
        window.partnersConfigData = {};
        let currentUser = JSON.parse(localStorage.getItem("moaath_user") || "null");

        let knownOrderIds = null;
        function playNewOrderSound() {
            try {
                if (navigator.vibrate) navigator.vibrate([250, 100, 250]);
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                [660, 880].forEach((freq, i) => {
                    const osc = ctx.createOscillator(), gain = ctx.createGain();
                    osc.type = "sine"; osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.18);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.18);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.16);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + i * 0.18); osc.stop(ctx.currentTime + i * 0.18 + 0.17);
                });
            } catch (e) {}
        }

        const installBtn = $("mainInstallAppBtn");
        async function installAppDirectly() {
            if (window.deferredPrompt) {
                window.deferredPrompt.prompt();
                const res = await window.deferredPrompt.userChoice;
                if (res?.outcome === "accepted" && installBtn) installBtn.style.display = "none";
                window.deferredPrompt = null;
            } else if (isAppStandalone()) {
                if (installBtn) installBtn.style.display = "none"; alert("✅ التطبيق مثبت بالفعل ويعمل من الشاشة الرئيسية!");
            } else alert("📲 لتثبيت التطبيق: افتح قائمة المتصفح (⋮) واختر 'التثبيت وإنشاء اختصار'.");
        }
        window.addEventListener("appinstalled", () => { if (installBtn) installBtn.style.display = "none"; window.deferredPrompt = null; });
        document.addEventListener("DOMContentLoaded", () => { if (isAppStandalone() && installBtn) installBtn.style.display = "none"; });

        let isExitingApp = false;
        window.addEventListener('load', () => {
            history.pushState({ page: 'store_home' }, '');
            window.addEventListener('popstate', () => {
                if (isExitingApp) return;
                for (let id of ['cartModal', 'profileModal', 'adminModal', 'reviewModal', 'missingModal', 'adminEditCustomerModal', 'partnerModal', 'competitionsPage', 'creditLedgerModal', 'exportManagerModal']) {
                    const el = $(id);
                    if (el && (el.style.display === 'flex' || el.style.display === 'block')) {
                        el.style.display = 'none'; history.pushState({ page: 'store_home' }, ''); return;
                    }
                }
                if (confirm("هل تريد إغلاق التطبيق بالفعل؟")) { isExitingApp = true; history.back(); }
                else history.pushState({ page: 'store_home' }, '');
            });
        });

        function isRegionOpenNow(regionName) {
            const reg = deliveryFees[regionName], now = new Date(), cur = now.getHours() * 60 + now.getMinutes();
            const checkRange = (o, c) => {
                const [oH, oM] = (o || "08:00").split(":").map(Number), [cH, cM] = (c || "23:00").split(":").map(Number);
                const oMin = oH * 60 + oM, cMin = cH * 60 + cM;
                return oMin <= cMin ? (cur >= oMin && cur < cMin) : (cur >= oMin || cur < cMin);
            };
            if (reg && reg.hoursEnabled) return checkRange(reg.open, reg.close);
            return !workHoursSettings.enabled ? true : checkRange(workHoursSettings.open, workHoursSettings.close);
        }

        function checkStoreWorkHours() {
            const overlay = $("storeClosedOverlay"); if (!overlay) return true;
            const defReg = Object.keys(deliveryFees)[0] || "العوينة";
            const uReg = (currentUser?.region && deliveryFees.hasOwnProperty(currentUser.region)) ? currentUser.region : defReg;
            if (!isRegionOpenNow(uReg)) {
                const r = deliveryFees[uReg], custom = r && r.hoursEnabled;
                if ($("closedMessageText")) $("closedMessageText").innerHTML = `نعتذر منكم، خدمة التوصيل لمنطقة (<b>${uReg}</b>) مغلقة حالياً.<br>ساعات التوصيل المعتمدة: من <b>${custom ? r.open : workHoursSettings.open}</b> إلى <b>${custom ? r.close : workHoursSettings.close}</b>.`;
                overlay.style.display = "flex"; return false;
            }
            overlay.style.display = "none"; return true;
        }
        setInterval(checkStoreWorkHours, 60000);

        const getLockedHighResImage = id => highResImagesMemoryCache[id] || ((products[id]?.image?.length > 100) ? (highResImagesMemoryCache[id] = products[id].image) : null);
        const calcSYP = usd => Math.round(((parseFloat(usd) || 0) * exchangeRate) / 5) * 5;
        const formatWhatsAppPhone = p => { let s = String(p || "").replace(/[^0-9]/g, ""); if (s.startsWith("00")) s = s.substring(2); return s.startsWith("09") ? "963" + s.substring(1) : s; };

        if (localStorage.getItem("moaath_theme") === "light") {
            document.body.classList.add("light-mode"); setTxt("themeBtn", "🌙"); $("themeColorMeta")?.setAttribute("content", "#F0F2F5");
        }
        function toggleTheme() {
            const isLight = document.body.classList.toggle("light-mode");
            localStorage.setItem("moaath_theme", isLight ? "light" : "dark");
            setTxt("themeBtn", isLight ? "🌙" : "☀️"); $("themeColorMeta")?.setAttribute("content", isLight ? "#F0F2F5" : "#121212");
        }

        function compressDualImages(file) {
            return new Promise((res, rej) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => {
                        const resize = (maxW, q) => {
                            const c = document.createElement("canvas"); let w = img.width, h = img.height;
                            if (w > maxW) { h = Math.max(1, Math.round((h * maxW) / w)); w = maxW; }
                            c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h); return c.toDataURL("image/jpeg", q);
                        };
                        res({ thumb: resize(36, 0.15), image: resize(360, 0.65) });
                    };
                    img.onerror = rej; img.src = e.target.result;
                };
                reader.onerror = rej; reader.readAsDataURL(file);
            });
        }

        const getRegionFee = r => {
            const item = deliveryFees[r]; if (!item) return 0;
            if (currentUser?.userType === "neighbors" && typeof item === "object" && item.neighborFee !== undefined) return parseInt(item.neighborFee) || 0;
            return (typeof item === "object") ? (parseInt(item.fee) || 0) : (parseInt(item) || 0);
        };
        const getRegionDriverPct = r => (deliveryFees[r] && typeof deliveryFees[r] === "object" && deliveryFees[r].driverPct !== undefined) ? parseFloat(deliveryFees[r].driverPct) : 80;

        function populateRegionSelects() {
            const names = Object.keys(deliveryFees);
            if (!names.length) { deliveryFees = { "العوينة": { fee: 2000, neighborFee: 0, driverPct: 80, hoursEnabled: false, open: "08:00", close: "23:00" } }; names.push("العوينة"); }
            ["regRegion", "cartRegionSelect", "adminCustRegion"].forEach(id => {
                const el = $(id); if (!el) return; const prev = el.value;
                el.innerHTML = names.map(r => `<option value="${r}">${r} (${getRegionFee(r).toLocaleString()} ل.س)</option>`).join("");
                el.value = (prev && deliveryFees.hasOwnProperty(prev)) ? prev : ((currentUser?.region && deliveryFees.hasOwnProperty(currentUser.region)) ? currentUser.region : names[0]);
            });
            renderAdminDeliveryRegions();
        }

        function renderAdminDeliveryRegions() {
            const container = $("adminDeliveryRegionsList"); if (!container) return;
            container.innerHTML = Object.keys(deliveryFees).map((reg, idx) => {
                const item = deliveryFees[reg] || {}, fee = parseInt(item.fee) || 0, nFee = item.neighborFee !== undefined ? parseInt(item.neighborFee) : fee, dPct = item.driverPct !== undefined ? parseFloat(item.driverPct) : 80;
                const hEn = !!item.hoursEnabled, oT = item.open || "08:00", cT = item.close || "23:00";
                return `<div class="adm-card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <span style="font-weight:bold; color:var(--gold-color);">📍 ${reg}</span>
                        <button type="button" onclick="removeDeliveryRegion(${idx})" class="btn btn-danger" style="width:auto; padding:3px 8px; font-size:10px;">🗑️ حذف</button>
                    </div>
                    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;">
                        <div style="flex:1; min-width:85px;"><label style="font-size:10px; color:var(--gray-text);">العادي:</label><input type="number" class="form-control reg-fee-val" data-region="${reg}" value="${fee}"></div>
                        <div style="flex:1; min-width:85px;"><label style="font-size:10px; color:var(--gray-text);">الجيران:</label><input type="number" class="form-control reg-neighbor-val" data-region="${reg}" value="${nFee}"></div>
                        <div style="flex:1; min-width:75px;"><label style="font-size:10px; color:var(--gray-text);">السائق %:</label><input type="number" class="form-control reg-pct-val" data-region="${reg}" value="${dPct}" min="0" max="100"></div>
                    </div>
                    <div style="border-top:1px dashed var(--border-color); padding-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                        <input type="checkbox" class="reg-hen-val" data-region="${reg}" ${hEn ? 'checked' : ''} id="hen_${idx}">
                        <label for="hen_${idx}" style="font-size:11px; cursor:pointer; margin:0;">دوام مخصص</label>
                        <div style="display:flex; align-items:center; gap:4px; margin-right:auto;">
                            <input type="time" class="reg-open-val" data-region="${reg}" value="${oT}" style="padding:2px; font-size:11px; background:var(--card-bg); color:var(--text-color); border:1px solid var(--border-color); border-radius:4px;">
                            <input type="time" class="reg-close-val" data-region="${reg}" value="${cT}" style="padding:2px; font-size:11px; background:var(--card-bg); color:var(--text-color); border:1px solid var(--border-color); border-radius:4px;">
                        </div>
                    </div>
                </div>`;
            }).join("");
        }

        function collectDeliveryRegionsFromDOM() {
            document.querySelectorAll(".reg-fee-val").forEach(inp => {
                const r = inp.getAttribute("data-region");
                if (r) {
                    const nInput = document.querySelector(`.reg-neighbor-val[data-region="${r}"]`);
                    deliveryFees[r] = { fee: parseInt(inp.value) || 0, neighborFee: nInput && nInput.value !== "" ? (parseInt(nInput.value) || 0) : 0, driverPct: Math.min(100, Math.max(0, parseFloat(document.querySelector(`.reg-pct-val[data-region="${r}"]`)?.value) || 80)), hoursEnabled: document.querySelector(`.reg-hen-val[data-region="${r}"]`)?.checked || false, open: document.querySelector(`.reg-open-val[data-region="${r}"]`)?.value || "08:00", close: document.querySelector(`.reg-close-val[data-region="${r}"]`)?.value || "23:00" };
                }
            });
        }

        function addDeliveryRegion() {
            const name = ($("newRegionNameInput").value || "").trim(), fee = parseInt($("newRegionFeeInput").value) || 0;
            const dPct = Math.min(100, Math.max(0, parseFloat($("newRegionDriverPctInput").value) || 80));
            if (!name) return alert("⚠️ يرجى إدخال اسم المنطقة أولاً.");
            collectDeliveryRegionsFromDOM();
            deliveryFees[name] = { fee, neighborFee: fee, driverPct: dPct, hoursEnabled: false, open: "08:00", close: "23:00" };
            setVal("newRegionNameInput", ""); populateRegionSelects();
            db.ref("settings/deliveryFees").set(deliveryFees).then(() => alert(`✅ تمت إضافة منطقة (${name})!`));
        }

        function removeDeliveryRegion(idx) {
            const names = Object.keys(deliveryFees);
            if (names.length <= 1) return alert("⚠️ يجب بقاء منطقة واحدة على الأقل.");
            if (!confirm(`حذف منطقة (${names[idx]})؟`)) return;
            delete deliveryFees[names[idx]]; populateRegionSelects(); db.ref("settings/deliveryFees").set(deliveryFees);
        }

        function populatePartnerSelectOptions() {
            const box = $("partnerCategoriesCheckboxes"); if (!box) return;
            box.innerHTML = categories.filter(c => c !== "الكل").map(c => `<label style="display:inline-flex; align-items:center; gap:4px; font-size:11px; background:var(--card-bg); padding:4px 8px; border-radius:6px; border:1px solid var(--border-color); cursor:pointer;"><input type="checkbox" class="partner-cat-cb" value="${c}"> ${c}</label>`).join("");
        }

        function saveQuickExchangeRate() {
            const val = parseFloat($("quickExchangeInput")?.value);
            if (!val || val <= 0) return alert("⚠️ أدخل سعر صرف صحيح.");
            exchangeRate = val; setVal("exchangeRateInput", val);
            db.ref("settings/exchangeRate").set(val).then(() => alert(`✅ تم تحديث سعر الصرف إلى (${val.toLocaleString()} ل.س) فوراً!`));
        }

        db.ref("settings").on("value", snap => {
            const d = snap.val() || {};
            exchangeRate = parseFloat(d.exchangeRate) || 15000;
            deliveryDriverPhone = d.deliveryDriverPhone || "";
            adminWhatsAppNumber = d.adminWhatsApp || "963965461504";
            shamWalletIdGlobal = d.shamWalletId || "da3e13cd8a2ef2af282445e148df9599";
            exportManagerPhone = d.exportManagerPhone || "";
            if (d.workHours) workHoursSettings = { enabled: !!d.workHours.enabled, open: d.workHours.open || "08:00", close: d.workHours.close || "23:00" };
            if ($("workHoursEnabled")) $("workHoursEnabled").checked = workHoursSettings.enabled;
            setVal("workHourOpen", workHoursSettings.open); setVal("workHourClose", workHoursSettings.close); setTxt("headerPhoneText", adminWhatsAppNumber);
            if (d.deliveryFees && Object.keys(d.deliveryFees).length) {
                deliveryFees = {};
                Object.keys(d.deliveryFees).forEach(k => {
                    const i = d.deliveryFees[k];
                    deliveryFees[k] = (i && typeof i === "object") ? { fee: parseInt(i.fee) || 0, neighborFee: i.neighborFee !== undefined ? (parseInt(i.neighborFee) || 0) : (parseInt(i.fee) || 0), driverPct: i.driverPct !== undefined ? parseFloat(i.driverPct) : 80, hoursEnabled: !!i.hoursEnabled, open: i.open || "08:00", close: i.close || "23:00" } : { fee: parseInt(i) || 0, neighborFee: parseInt(i) || 0, driverPct: 80, hoursEnabled: false, open: "08:00", close: "23:00" };
                });
            }
            populateRegionSelects();
            setVal("exchangeRateInput", exchangeRate); setVal("quickExchangeInput", exchangeRate); setVal("deliveryPhoneInput", deliveryDriverPhone);
            setVal("adminWhatsAppInput", adminWhatsAppNumber); setVal("adminShamWalletInput", shamWalletIdGlobal); setVal("exportManagerPhoneInput", exportManagerPhone);
            checkStoreWorkHours(); renderStore(); syncCurrentUser();
        });

        db.ref("creditLedgers").on("value", snap => {
            creditLedgerData = snap.val() || {};
            if (currentUser && currentUser.userType === 'credit') renderCustomerCreditView();
            renderAdminCreditLedger(); renderStatsDashboard();
        });

        db.ref("adminAccounting").on("value", snap => {
            if (snap.val()) adminAccounting = { ...adminAccounting, ...snap.val() };
            setVal("importManagerPctInput", adminAccounting.importManagerPct ?? 50);
            renderStatsDashboard();
        });

        db.ref("storeExpenses").on("value", snap => { storeExpenses = snap.val() || {}; renderStoreExpenses(); renderStatsDashboard(); });

        db.ref("categories").on("value", snap => {
            const d = snap.val() || ["مواد غذائية", "منظفات", "مشروبات"];
            categories = ["الكل", ...d]; renderCategories(); renderAdminCategories(d); populatePartnerSelectOptions(); renderStatsDashboard();
        });

        db.ref("suppliers").on("value", snap => { suppliers = snap.val() || {}; renderAdminSuppliers(); populateSupplierSelect(); renderShortages(); });

        db.ref("products").on("value", snap => {
            products = snap.val() || {};
            const keys = Object.keys(products);
            if (!shuffledProductKeys.length) shuffledProductKeys = [...keys].sort(() => Math.random() - 0.5);
            else { shuffledProductKeys = shuffledProductKeys.filter(k => products[k]); keys.forEach(k => { if (!shuffledProductKeys.includes(k)) shuffledProductKeys.push(k); }); }
            renderStore(); renderAdminProducts(); renderShortages(); renderStatsDashboard();
        });

        db.ref("specialOffers").on("value", snap => { specialOffers = snap.val() || {}; renderSpecialOffers(); renderAdminOffersList(); renderStatsDashboard(); });
        db.ref("users").on("value", snap => { users = snap.val() || {}; syncCurrentUser(); renderAdminCustomers(); renderLeaderboard(); renderStatsDashboard(); renderStore(); populateAdminPartnerSelect(); renderAdminCreditLedger(); });
        db.ref("partnersConfig").on("value", snap => { window.partnersConfigData = snap.val() || {}; syncCurrentUser(); loadPartnerConfig(); renderStatsDashboard(); });

        db.ref("competition").on("value", snap => {
            if (snap.val()) compSettings = { ...compSettings, ...snap.val() };
            setVal("minRedeemPointsInput", compSettings.minRedeemPoints || 500); setVal("leaderboardLimitInput", compSettings.leaderboardLimit || 10);
            setVal("compTitleInput", compSettings.title || ""); setVal("compDescInput", compSettings.desc || "");
            syncCurrentUser(); renderCompetitionDetails(); renderLeaderboard();
        });

        db.ref("pendingOrders").on("value", snap => {
            const newOrders = snap.val() || {}; const newIds = Object.keys(newOrders);
            if (knownOrderIds !== null && newIds.some(id => !knownOrderIds.includes(id))) playNewOrderSound();
            knownOrderIds = newIds; pendingOrders = newOrders;
            renderPendingOrders(); renderExportManagerOrders();
        });

        db.ref("completedOrdersHistory").on("value", snap => { completedOrdersHistory = snap.val() || {}; renderStatsDashboard(); renderAdminProducts(); });
        db.ref("missingRequests").on("value", snap => { missingRequests = snap.val() || {}; renderCustomerMissingRequests(); });

        const validatePhoneSyrian = p => /^09[0-9]{8}$/.test(String(p || "").trim().replace(/\s+/g, ""));

        function fillProfileInputs() {
            populateRegionSelects();
            if (currentUser) {
                setVal("regName", currentUser.name || ""); setVal("regPhone", currentUser.phone || "");
                if (currentUser.region && deliveryFees.hasOwnProperty(currentUser.region)) setVal("regRegion", currentUser.region);
                setVal("regAddress", currentUser.address || ""); setVal("regPointsVisibility", currentUser.pointsVisibility || "public");
            }
        }

        window.addEventListener("load", () => {
            populateRegionSelects(); fillProfileInputs();
            if (!currentUser?.phone || !currentUser?.name || !currentUser?.region || !validatePhoneSyrian(currentUser.phone)) {
                $("closeProfileBtn").style.display = "none"; $("profileModal").style.display = "flex";
            } else syncCurrentUser();
            renderCategories(); renderStore(); checkStoreWorkHours();
        });

        function openEditProfile() { fillProfileInputs(); $("closeProfileBtn").style.display = "block"; $("profileModal").style.display = "flex"; }

        function saveUserProfile() {
            const name = $("regName").value.trim(), newPhone = $("regPhone").value.trim().replace(/\s+/g, ""), region = $("regRegion").value, address = $("regAddress").value.trim();
            if (!validatePhoneSyrian(newPhone)) { $("regPhoneError").style.display = "block"; return alert("⚠️ الرقم يجب أن يتكون من 10 خانات ويبدأ بـ 09 حصراً."); }
            $("regPhoneError").style.display = "none";
            if (!name || !region || !address) return alert("⚠️ يرجى إدخال الاسم، المنطقة، وتفاصيل العنوان.");

            const oldPhone = currentUser?.phone || null;
            const prev = (oldPhone && users[oldPhone]) ? users[oldPhone] : (users[newPhone] || currentUser || {});
            if (prev.banned) return alert("🚫 عذراً، هذا الحساب محظور.");

            const updatedData = { name, phone: newPhone, region, address, points: prev.points || 0, purchases: prev.purchases || {}, userType: prev.userType || "retail", pointsVisibility: $("regPointsVisibility").value, banned: !!prev.banned, successOrders: prev.successOrders || 0, canceledOrders: prev.canceledOrders || 0 };
            if (oldPhone && oldPhone !== newPhone && users[oldPhone]) db.ref("users/" + oldPhone).remove();

            currentUser = updatedData; localStorage.setItem("moaath_user", JSON.stringify(currentUser));
            db.ref("users/" + newPhone).update(updatedData);
            closeModal('profileModal'); syncCurrentUser(); updateCartBar(); checkStoreWorkHours(); alert("✅ تم حفظ بياناتك بنجاح!");
        }

        function calculateUserRank(phone) {
            if (!phone || !users[phone] || !(users[phone].points > 0)) return "-";
            const idx = Object.values(users).filter(u => (u.points || 0) > 0 && !u.banned).sort((a, b) => (b.points || 0) - (a.points || 0)).findIndex(u => u.phone === phone);
            return idx !== -1 ? `#${idx + 1}` : "-";
        }

        function syncCurrentUser() {
            if (!currentUser?.phone) return;
            if (users[currentUser.phone]) { currentUser = { ...currentUser, ...users[currentUser.phone] }; localStorage.setItem("moaath_user", JSON.stringify(currentUser)); }
            const pts = Math.round(currentUser.points || 0), rank = calculateUserRank(currentUser.phone);
            setTxt("userNameDisplay", currentUser.name); setTxt("userRegionBadge", currentUser.region ? `(${currentUser.region})` : "");
            
            const isW = currentUser.userType === "wholesale", isN = currentUser.userType === "neighbors", isP = currentUser.userType === "partner", isC = currentUser.userType === "credit";
            let badgeText = "مفرق"; if(isP) badgeText = "شريك"; else if(isN) badgeText = "جيران"; else if(isW) badgeText = "جملة"; else if(isC) badgeText = "آجل";
            setTxt("userTypeBadge", `[${badgeText}]`);
            
            setTxt("userPoints", pts); setTxt("compUserPoints", pts);
            if ($("userRankBadge")) { $("userRankBadge").style.display = rank !== "-" ? "inline-flex" : "none"; setTxt("userRankBadge", `🏅 ترتيبي: ${rank}`); }
            setTxt("compUserRankDisplay", rank !== "-" ? rank : "غير مصنف");

        function calculatePartnerCurrentMetrics(phone) {
            const conf = (window.partnersConfigData && window.partnersConfigData[phone]) || {};
            const rawCats = conf.categories || [], allowedCats = rawCats.map(c => c.trim().toLowerCase());
            const partnerPct = parseFloat(conf.profitPct) || 20, lastSettlementISO = conf.lastSettlementISO || "2000-01-01T00:00:00.000Z";
            let totSales = 0, totEarn = 0, totalItemsCount = 0, totalStockUnits = 0, partnerItemsMap = {};
            Object.values(products).forEach(p => {
                if (allowedCats.includes((p.category || "").trim().toLowerCase())) {
                    const st = Math.max(0, parseInt(p.stock) || 0);
                    totalItemsCount++; totalStockUnits += st; partnerItemsMap[p.name] = { cat: p.category, stock: st, qtySold: 0, sales: 0, earn: 0 };
                }
            });
            Object.values(completedOrdersHistory).forEach(ord => {
                if ((ord.dateISO || new Date().toISOString()) > lastSettlementISO) {
                    (ord.items || []).forEach(item => {
                        if (allowedCats.includes((item.category || "").trim().toLowerCase())) {
                            const sSale = item.subSaleSYP || 0, sProfit = item.netProfitSYP !== undefined ? item.netProfitSYP : (sSale - (item.subCostSYP || 0));
                            const earn = Math.round((sProfit * partnerPct) / 100);
                            totSales += sSale; totEarn += earn;
                            if (!partnerItemsMap[item.name]) partnerItemsMap[item.name] = { cat: item.category || "-", stock: 0, qtySold: 0, sales: 0, earn: 0 };
                            partnerItemsMap[item.name].qtySold += (item.qty || 1); partnerItemsMap[item.name].sales += sSale; partnerItemsMap[item.name].earn += earn;
                        }
                    });
                }
            });
            return { conf, rawCats, partnerPct, totSales, totEarn, totalItemsCount, totalStockUnits, partnerItemsMap };
        }

            });
            const phone = o.customerPhone, purch = users[phone]?.purchases || {};
            (o.items || []).forEach(i => { if (!i.id.startsWith("OFFER_")) purch[i.id] = true; });
            const upPts = (users[phone]?.points || 0) + (o.earnedPoints || 0);
            db.ref(`users/${phone}`).update({ name: o.customerName, phone, region: o.customerRegion, address: o.customerAddress, points: upPts, purchases: purch, successOrders: (users[phone]?.successOrders||0)+1 });

        function openAdminEditCustomerModal(p) {
            const u = users[p]; if (!u) return; populateRegionSelects();
            setVal("adminCustOrigPhone", p); setVal("adminCustName", u.name || ""); setVal("adminCustPhone", u.phone || p);
            setVal("adminCustRegion", u.region || "العوينة"); setVal("adminCustType", u.userType || "retail"); setVal("adminCustAddress", u.address || ""); setVal("adminCustPoints", Math.round(u.points || 0));
            $("adminEditCustomerModal").style.display = "flex";
        }
        function saveAdminCustomerEdit() {
            const oldP = $("adminCustOrigPhone").value, newP = $("adminCustPhone").value.trim();
            if (!oldP || !users[oldP]) return;
            if (!validatePhoneSyrian(newP)) return alert("⚠️ رقم الهاتف الجديد غير صالح (يجب أن يكون 10 خانات ويبدأ بـ 09).");
            const uData = { ...users[oldP], name: $("adminCustName").value.trim(), region: $("adminCustRegion").value, userType: $("adminCustType").value, address: $("adminCustAddress").value.trim(), points: parseFloat($("adminCustPoints").value) || 0, phone: newP };
            
            if(oldP !== newP) {
                db.ref("users/" + newP).set(uData).then(() => {
                    db.ref("users/" + oldP).remove();
                    if(creditLedgerData[oldP]) db.ref("creditLedgers/" + newP).set(creditLedgerData[oldP]).then(() => db.ref("creditLedgers/" + oldP).remove());
                    if(window.partnersConfigData[oldP]) db.ref("partnersConfig/" + newP).set(window.partnersConfigData[oldP]).then(() => db.ref("partnersConfig/" + oldP).remove());
                });
            } else { db.ref("users/" + oldP).update(uData); }
            alert("✅ تم حفظ تعديلات الزبون وتصحيحها!"); closeModal('adminEditCustomerModal'); populateAdminPartnerSelect(); renderAdminCreditLedger();
        }
        function deleteCustomerAdmin(phone) {
            if(confirm(`⚠️ هل أنت متأكد من حذف حساب الزبون نهائياً وحذف سجله؟`)) {
                db.ref("users/" + phone).remove(); db.ref("creditLedgers/" + phone).remove(); db.ref("partnersConfig/" + phone).remove();
            }
        }
    </script>
</body>
</html>
