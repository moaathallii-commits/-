<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر معاذ - قرية العوينة</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --gold-color: #D4AF37;
            --text-color: #FFFFFF;
            --gray-text: #AAAAAA;
            --danger-color: #ff4444;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--gold-color);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .store-info h1 {
            font-size: 16px;
            color: var(--gold-color);
            margin: 0 0 3px 0;
        }
        .store-info p {
            font-size: 11px;
            color: var(--gray-text);
            margin: 0;
        }
        .logo-circle {
            width: 42px;
            height: 42px;
            background-color: var(--gold-color);
            color: var(--bg-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            user-select: none;
        }
        .user-bar {
            background: #181818;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .container {
            padding: 10px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--gold-color);
            color: #fff;
            border-radius: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .categories {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .cat-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }
        .cat-btn.active {
            background: var(--gold-color);
            color: #000;
            font-weight: bold;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .product-card h3 {
            font-size: 14px;
            margin: 5px 0;
        }
        .product-card p {
            color: var(--gold-color);
            font-size: 13px;
            margin: 5px 0;
        }
        .btn {
            background: var(--gold-color);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
        }
        .btn-out {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--card-bg);
            border-top: 2px solid var(--gold-color);
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <div class="store-info">
            <h1>متجر معاذ</h1>
            <p>قرية العوينة | 0965461504</p>
        </div>
        <!-- الشعار السري للإدارة بـ 5 ضغطات -->
        <div class="logo-circle" id="adminTrigger">م</div>
    </header>

    <div class="user-bar">
        <span>👤 الزبون: <b id="userNameDisplay">زائر كريم</b></span>
        <span style="color: var(--gold-color);">🎁 هدية متجر معاذ: <b id="userPoints">0</b> نقطة</span>
    </div>

    <div class="container">
        <!-- شريط البحث الفوري -->
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن أي منتج..." oninput="filterProducts()">

        <!-- شريط الفئات -->
        <div class="categories">
            <button class="cat-btn active" onclick="setCategory('الكل', this)">الكل</button>
            <button class="cat-btn" onclick="setCategory('غذائيات', this)">غذائيات</button>
            <button class="cat-btn" onclick="setCategory('منظفات', this)">منظفات</button>
            <button class="cat-btn" onclick="setCategory('مشروبات باردة وساخنة', this)">مشروبات باردة وساخنة</button>
            <button class="cat-btn" onclick="setCategory('نقرشات', this)">نقرشات</button>
        </div>

        <!-- شبكة المنتجات -->
        <div class="products-grid" id="productsGrid">
            <!-- المنتجات تولد برمجياً -->
        </div>
    </div>

    <div style="height: 70px;"></div>

    <!-- شريط السلة العائم -->
    <div class="cart-bar" id="cartBar" style="display:none;">
        <span>المنتجات: <b id="cartCount">0</b> | الإجمالي: <b id="cartTotal">0</b> ل.س</span>
        <button class="btn" onclick="openCheckout()" style="width: auto; padding: 8px 20px;">إتمام الطلب والدفع</button>
    </div>

    <!-- نافذة تسجيل دخول الإدارة السري -->
    <div id="adminModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:var(--card-bg); padding:20px; border-radius:10px; border:1px solid var(--gold-color); width:80%; max-width:300px; text-align:center;">
            <h3 style="color:var(--gold-color);">لوحة الإدارة السرية</h3>
            <input type="password" id="adminPass" placeholder="كلمة المرور" style="width:90%; padding:10px; margin:10px 0; background:#121212; color:#fff; border:1px solid #444; border-radius:5px;">
            <br>
            <button onclick="checkAdminPassword()" class="btn" style="margin-bottom: 5px;">دخول</button>
            <button onclick="closeAdminModal()" style="background:transparent; color:#aaa; border:none; padding:8px; cursor:pointer;">إلغاء</button>
        </div>
    </div>

    <script>
        // بيانات المنتجات الأولية
        let products = [
            { id: 1, name: "رز بسمتي نخب أول 1 كغ", category: "غذائيات", basePrice: 270, stock: 10 },
            { id: 2, name: "زيت دوار الشمس 1 ليتر", category: "غذائيات", basePrice: 235, stock: 5 },
            { id: 3, name: "مسحوق غسيل أوتوماتيك 2.5 كغ", category: "منظفات", basePrice: 500, stock: 8 },
            { id: 4, name: "مشروب غازي عائلي", category: "مشروبات باردة وساخنة", basePrice: 110, stock: 0 }, // نفذت الكمية تجريبياً
            { id: 5, name: "سائل جلي مركز 1 ليتر", category: "منظفات", basePrice: 140, stock: 12 },
            { id: 6, name: "مكسرات مشكلة فاخرة 250غ", category: "نقرشات", basePrice: 310, stock: 15 }
        ];

        let exchangeRate = 1; // معامل التسعير أو سعر الصرف
        let currentCategory = 'الكل';
        let cart = {};

        // عرض المنتجات
        function renderProducts(filterText = '') {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            let filtered = products.filter(p => {
                let matchesCat = currentCategory === 'الكل' || p.category === currentCategory;
                let matchesSearch = p.name.toLowerCase().includes(filterText.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: span 2; text-align:center; color:#888;">لا توجد منتجات مطابقة</p>';
                return;
            }

            filtered.forEach(p => {
                let finalPrice = p.basePrice * exchangeRate;
                let isOut = p.stock <= 0;
                let card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div style="font-size:11px; color:#aaa; margin-bottom:3px;">${p.category}</div>
                    <h3>${p.name}</h3>
                    <p>${finalPrice} ل.س</p>
                    ${isOut ? '<button class="btn btn-out" disabled>نفذت الكمية</button>' : `<button class="btn" onclick="addToCart(${p.id})">إضافة للسلة</button>`}
                `;
                grid.appendChild(card);
            });
        }

        function setCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(document.getElementById('searchInput').value);
        }

        function filterProducts() {
            let query = document.getElementById('searchInput').value;
            renderProducts(query);
        }

        function addToCart(productId) {
            let p = products.find(x => x.id === productId);
            if (!cart[productId]) {
                cart[productId] = { ...p, qty: 1 };
            } else {
                cart[productId].qty++;
            }
            updateCartBar();
        }

        function updateCartBar() {
            let count = 0;
            let total = 0;
            for (let id in cart) {
                count += cart[id].qty;
                total += (cart[id].basePrice * exchangeRate) * cart[id].qty;
            }
            const bar = document.getElementById('cartBar');
            if (count > 0) {
                bar.style.display = 'flex';
                document.getElementById('cartCount').innerText = count;
                document.getElementById('cartTotal').innerText = total;
            } else {
                bar.style.display = 'none';
            }
        }

        function openCheckout() {
            alert("تم الانتقال لصفحة تأكيد الطلب والدفع عبر شام كاش وإرسال الفاتورة لواتساب 0965461504");
        }

        // منطق الدخول السري (5 ضغطات)
        let tapCount = 0;
        document.getElementById('adminTrigger').addEventListener('click', () => {
            tapCount++;
            if (tapCount >= 5) {
                tapCount = 0;
                document.getElementById('adminModal').style.display = 'flex';
            }
            setTimeout(() => { tapCount = 0; }, 2000);
        });

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('adminPass').value = '';
        }

        function checkAdminPassword() {
            let pass = document.getElementById('adminPass').value;
            if (pass === "MHA@1997//MOAATHS") {
                alert("تم تسجيل دخول الإدارة بنجاح!");
                closeAdminModal();
                // هنا تفتح لوحة التحكم الخاصة بك لتحديث أسعار الصرف وإدارة المخزون والنقاط
            } else {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        // التشغيل الأولي
        renderProducts();
    </script>
</body>
</html>
